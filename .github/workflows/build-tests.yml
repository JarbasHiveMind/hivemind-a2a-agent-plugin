name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13"]'
      test_path: 'tests'
      pre_install_pip: '"hivemind-plugin-manager>=0.5.0,<1.0.0" "pytest-httpx" "fastapi" "uvicorn" "anyio[trio]"'
