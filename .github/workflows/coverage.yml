name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@dev
    with:
      python_version: '3.11'
      coverage_source: 'hivemind_a2a_agent_plugin'
      test_path: 'tests/'
      min_coverage: 0
      # version policy is in pyproject (the `test` extra); no pre_install pins.
      test_extras: 'test'
